name: collect

on:
  schedule:
    # 毎時 35分（UTC）。気象庁ランキングCSVが毎時25分ごろ更新されるので、その後。
    - cron: "35 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "collectors/**"
      - "core/**"
      - ".github/workflows/collect.yml"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run collectors
        run: python -m core.run

      - name: Commit updated data
        run: |
          git config user.name  "nihon-no-suji-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ api/
          if git diff --cached --quiet; then
            echo "変化なし"; exit 0
          fi
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ) 自動更新"
          # 人間のコード push とレースするので、rebase してリトライ
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "push OK (try $i)"; exit 0
            fi
            echo "retry $i"; sleep $(( (RANDOM % 8) + 3 ))
          done
          echo "::error::push に5回失敗"; exit 1
