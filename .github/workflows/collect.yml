name: collect

on:
  schedule:
    # 毎時 35分（UTC）。気象庁ランキングCSVが毎時25分ごろ更新されるので、その後。
    - cron: "35 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "collectors/**"
      - "core/**"
      - ".github/workflows/collect.yml"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run collectors
        run: python -m core.run

      - name: Commit updated data
        run: |
          git config user.name  "nihon-no-suji-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ api/
          if git diff --cached --quiet; then
            echo "変化なし"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ) 自動更新"
            git push
          fi
