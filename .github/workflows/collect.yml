name: collect

on:
  schedule:
    # 毎時 35分（UTC）。気象庁ランキングCSVが毎時25分ごろ更新されるので、その後。
    - cron: "35 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "collectors/**"
      - "core/**"
      - ".github/workflows/collect.yml"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run collectors
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: python -m core.run

      - name: Check collector health
        run: |
          python3 - <<'PY'
          import json, sys
          h = json.load(open("api/health.json"))
          if h["overall"] != "ok":
              for name in h["degraded"]:
                  print(f"::warning title=collector degraded::{name} — {h['generated_at']}")
          else:
              print("all collectors ok")
          PY

      - name: Commit updated data
        run: |
          git config user.name  "nihon-no-suji-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ api/
          if git diff --cached --quiet; then
            echo "変化なし"; exit 0
          fi
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ) 自動更新"
          # 人間のコード push とレースするので、rebase してリトライ
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "push OK (try $i)"; exit 0
            fi
            echo "retry $i"; sleep $(( (RANDOM % 8) + 3 ))
          done
          echo "::error::push に5回失敗"; exit 1

  # api/ と静的ページを GitHub Pages に配信する。
  # bot の push（GITHUB_TOKEN）では他のワークフローが起動しないので、同じワークフロー内で配信する。
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble site
        run: |
          mkdir _site
          cp -r api _site/api
          cp index.html _site/
          cp site/* _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
