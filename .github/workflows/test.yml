name: test

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "api/**"
      - "docs/**"
  pull_request:
  workflow_dispatch: {}

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v

  ios:
    runs-on: macos-latest
    timeout-minutes: 25
    if: contains(github.event.head_commit.message, 'iOS') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build & test
        working-directory: ios
        run: |
          SIM=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys;print(next(u["udid"] for k,v in json.load(sys.stdin)["devices"].items() for u in v if "iPhone" in u["name"]))')
          xcodebuild -project NihonNoSuji.xcodeproj -scheme NihonNoSuji \
            -sdk iphonesimulator -destination "id=$SIM" -resultBundlePath /tmp/r.xcresult test
