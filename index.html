<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日本の数字</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1a1a1a; --sub:#8a8a86; --bg:#faf8f4; --line:#e9e5dd;
    --up:#4a2420; --down:#56646f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.5; }
  .wrap { max-width:460px; margin:0 auto; padding:32px 22px 80px; }
  .clock { font-family:"Outfit",-apple-system,sans-serif; font-size:34px; font-weight:600;
    letter-spacing:.02em; font-variant-numeric:tabular-nums; }
  header { padding:8px 0 26px; }
  h1 { font-size:15px; font-weight:600; letter-spacing:.04em; }
  .date { color:var(--sub); font-size:13px; margin-top:2px; }
  .section-title { font-size:13px; font-weight:700; color:var(--ink); letter-spacing:.06em; padding:34px 0 6px; }
  .section:first-of-type .section-title { padding-top:0; }
  .card { padding:30px 0 26px; border-top:1px solid var(--line); }
  .card:first-of-type { border-top:none; }
  .section .card:first-child { padding-top:10px; }
  .name { font-size:13px; color:var(--sub); letter-spacing:.02em; }
  .row { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-top:10px; }
  .value { font-family:"Outfit",-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; font-size:44px; font-weight:600; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
  .value .unit { font-size:0.6em; font-weight:bold; margin-left:0.1em; }
  .change { font-size:15px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .change.up { color:var(--up); }
  .change.down { color:var(--down); }
  .change.flat { color:var(--sub); }
  .change.na { color:var(--line); }
  .caption { margin-top:12px; font-size:13.5px; color:#5f5f5a; }
  .stale { font-size:11px; color:var(--sub); margin-left:6px; }
  footer { margin-top:40px; font-size:11px; color:var(--sub); text-align:center; }
  a { color:inherit; }
</style>
</head>
<body>
<div class="wrap">
  <div class="clock" id="clock">--:--:--</div>
  <header>
    <h1>日本の数字</h1>
    <div class="date" id="date">読み込み中…</div>
  </header>
  <div id="cards"></div>
  <footer>
    昨日から、日本はどう変わった？<br>
    出典：気象庁・東京電力パワーグリッド・P2P地震情報 ほか公開データ
  </footer>
</div>
<script>
function tickClock() {
  document.getElementById("clock").textContent =
    new Date().toLocaleTimeString("ja-JP", { timeZone:"Asia/Tokyo", hour12:false });
}
tickClock();
setInterval(tickClock, 1000);

const ARROW = { up:"↑", down:"↓", flat:"→" };
const CATEGORY_ORDER = ["自然","インフラ","防災","こよみ","経済","社会"];
fetch("api/today.json?" + Date.now()).then(r => r.json()).then(d => {
  document.getElementById("date").textContent =
    new Date(d.date).toLocaleDateString("ja-JP",{month:"long",day:"numeric",weekday:"short"}) + "の日本";
  const box = document.getElementById("cards");

  const groups = new Map();
  for (const m of d.metrics) {
    if (!groups.has(m.category)) groups.set(m.category, []);
    groups.get(m.category).push(m);
  }
  const cats = [...CATEGORY_ORDER.filter(c => groups.has(c)),
                ...[...groups.keys()].filter(c => !CATEGORY_ORDER.includes(c))];

  for (const cat of cats) {
    const section = document.createElement("section");
    section.className = "section";
    const h2 = document.createElement("h2");
    h2.className = "section-title";
    h2.textContent = cat;
    section.appendChild(h2);

    for (const m of groups.get(cat)) {
      const c = m.change || {};
      const cls = !c.available ? "na" : (c.direction || "flat");
      const chg = !c.available ? "—"
        : (["up","down"].includes(c.direction) ? ARROW[c.direction] + " " : "") + (c.display || "");
      const unit = m.unit || "";
      const hasUnitSuffix = unit && m.value_display.endsWith(unit);
      const valueMain = hasUnitSuffix
        ? m.value_display.slice(0, -unit.length) : m.value_display;
      const el = document.createElement("div");
      el.className = "card";
      el.innerHTML =
        `<div class="name">${m.name}${m.stale ? '<span class="stale">'+m.as_of+' 時点</span>' : ''}</div>
         <div class="row"><div class="value">${valueMain}${hasUnitSuffix ? '<span class="unit">'+unit+'</span>' : ''}</div>
         <div class="change ${cls}">${chg}</div></div>
         <div class="caption">${m.caption || ""}</div>`;
      section.appendChild(el);
    }
    box.appendChild(section);
  }
}).catch(e => {
  document.getElementById("date").textContent = "データを読み込めませんでした";
});
</script>
</body>
</html>
